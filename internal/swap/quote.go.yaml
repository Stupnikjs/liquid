package swap

import (
	"context"
	"math/big"
	"time"

	"github.com/Stupnikjs/liquid/internal/lqtypes"
	"github.com/ethereum/go-ethereum/common"
	"github.com/lmittmann/w3/module/eth"
	"github.com/lmittmann/w3/w3types"
)

// ---------------------------------------------------------------------------
// Interface
// ---------------------------------------------------------------------------

// Quoter is the single abstraction any DEX must implement.
// BestAmountIn, routing logic, and any future aggregator depend only on this.
type Quoter interface {
	// Quote returns the best PoolEdge for a given amountIn.
	// Returns false if no route satisfies the market's slippage constraint.
	Quote(ctx context.Context, amountIn *big.Int) (lqtypes.PoolEdge, bool)

	// DEX returns a human-readable identifier for logging and metrics.
	DEX() string
}

// ---------------------------------------------------------------------------
// Binary search — DEX agnostic
// ---------------------------------------------------------------------------

// BestAmountIn finds the largest amountIn for which the Quoter returns an
// acceptable slippage, using binary search (O(log n) RPC calls).
//
// Works with any Quoter implementation: Uniswap, Curve, Balancer, 1inch, etc.
func BestAmountIn(
	ctx context.Context,
	quoter Quoter,
	market lqtypes.MorphoMarket,
	amountIn *big.Int,
) (lqtypes.PoolEdge, bool) {
	lo := big.NewInt(1)
	hi := new(big.Int).Set(amountIn)
	var best lqtypes.PoolEdge
	found := false

	for i := 0; i < 12 && lo.Cmp(hi) <= 0; i++ {
		mid := new(big.Int).Rsh(new(big.Int).Add(lo, hi), 1)

		result, ok := quoter.Quote(ctx, mid)
		if ok && result.WCSlippage <= market.MaxSlippage() {
			best = result
			found = true
			lo = new(big.Int).Add(mid, big.NewInt(1))
		} else {
			hi = new(big.Int).Sub(mid, big.NewInt(1))
		}
	}

	return best, found
}

// BestQuoter runs BestAmountIn across multiple Quoters and returns the one
// that yields the highest amountOut. Useful for arb routing across DEXes.
func BestQuoter(
	ctx context.Context,
	quoters []Quoter,
	market lqtypes.MorphoMarket,
	amountIn *big.Int,
) (lqtypes.PoolEdge, bool) {
	var best lqtypes.PoolEdge
	found := false

	for _, q := range quoters {
		result, ok := BestAmountIn(ctx, q, market, amountIn)
		if !ok {
			continue
		}
		if !found || result.WCAmountOut.Cmp(best.WCAmountOut) > 0 {
			best = result
			found = true
		}
	}

	return best, found
}

// ---------------------------------------------------------------------------
// Uniswap V3 Quoter
// ---------------------------------------------------------------------------

// UniswapQuoter implements Quoter for Uniswap V3.
// It tries all standard fee tiers and returns the best amountOut.
type UniswapQuoter struct {
	conn        lqtypes.EthCaller
	market      lqtypes.MorphoMarket
	quoterAddr  common.Address
	oraclePrice *big.Int
	fees        []uint32
	rateLimit   time.Duration
}

func NewUniswapQuoter(
	conn lqtypes.EthCaller,
	market lqtypes.MorphoMarket,
	quoterAddr common.Address,
	oraclePrice *big.Int,
	rateLimit time.Duration,
) *UniswapQuoter {
	return &UniswapQuoter{
		conn:        conn,
		market:      market,
		quoterAddr:  quoterAddr,
		oraclePrice: oraclePrice,
		fees:        []uint32{100, 500, 3000, 10000},
		rateLimit:   rateLimit,
	}
}

func (u *UniswapQuoter) DEX() string { return "uniswap-v3" }

// Quote iterates over all fee tiers and returns the best PoolEdge.
func (u *UniswapQuoter) Quote(ctx context.Context, amountIn *big.Int) (lqtypes.PoolEdge, bool) {
	var best lqtypes.PoolEdge
	found := false

	for _, fee := range u.fees {
		time.Sleep(u.rateLimit)

		result, ok := u.callQuoter(ctx, amountIn, fee)
		if !ok {
			continue
		}
		if result.WCSlippage <= u.market.MaxSlippage() {
			if !found || result.WCAmountOut.Cmp(best.WCAmountOut) > 0 {
				best = result
				found = true
			}
		}
	}

	if found {
		best.AmountInOffset = 164 // amountIn offset in Uniswap calldata
	}
	return best, found
}

func (u *UniswapQuoter) callQuoter(ctx context.Context, amountIn *big.Int, fee uint32) (lqtypes.PoolEdge, bool) {
	params := lqtypes.QuoteExactInputSingleParams{
		TokenIn:           u.market.GetCollateralToken(),
		TokenOut:          u.market.GetLoanToken(),
		AmountIn:          amountIn,
		Fee:               big.NewInt(int64(fee)),
		SqrtPriceLimitX96: big.NewInt(0),
	}

	var (
		amountOut               *big.Int
		sqrtPriceX96After       *big.Int
		initializedTicksCrossed uint32
		gasEstimate             *big.Int
	)

	if err := u.conn.EthCallCtx(ctx, []w3types.RPCCaller{
		eth.CallFunc(u.quoterAddr, FuncQuoteExactInputSingleV2, params).Returns(
			&amountOut,
			&sqrtPriceX96After,
			&initializedTicksCrossed,
			&gasEstimate,
		),
	}); err != nil {
		return lqtypes.PoolEdge{}, false
	}

	return lqtypes.PoolEdge{
		TokenIn:      u.market.GetCollateralToken(),
		TokenOut:     u.market.GetLoanToken(),
		Quoter:       u.quoterAddr,
		Fee:          fee,
		WCSlippage:   ComputeSlippage(amountIn, amountOut, u.oraclePrice),
		WCAmountIn:   new(big.Int).Set(amountIn),
		WCAmountOut:  amountOut,
		CalibratedAt: time.Now(),
		PriceAtQuote: u.oraclePrice,
	}, true
}

// ---------------------------------------------------------------------------
// Slippage
// ---------------------------------------------------------------------------

// ComputeSlippage returns the slippage percentage between the oracle-expected
// output and the actual amountOut returned by the DEX.
// oraclePrice is expected to be scaled at 1e36 / decimalsCollateral * decimalsLoan
// as returned by MorphoChainlinkOracleV2.
func ComputeSlippage(amountIn, amountOut, oraclePrice *big.Int) float64 {
	if oraclePrice == nil || oraclePrice.Sign() == 0 {
		return 0
	}
	scale := new(big.Int).Exp(big.NewInt(10), big.NewInt(36), nil)
	expectedOut := new(big.Int).Div(
		new(big.Int).Mul(amountIn, oraclePrice),
		scale,
	)
	if expectedOut.Sign() == 0 {
		return 0
	}
	diff := new(big.Int).Sub(expectedOut, amountOut)
	slip, _ := new(big.Float).Quo(
		new(big.Float).SetInt(diff),
		new(big.Float).SetInt(expectedOut),
	).Float64()
	return slip * 100
}
